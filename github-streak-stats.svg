<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="GitHub streak stats placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a1f45"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <text x="40" y="80" fill="#00d4ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">pavan-charan // streak stats</text>
  <text x="40" y="132" fill="#ff6b35" font-family="Segoe UI, Arial, sans-serif" font-size="22">Initial placeholder generated locally.</text>
  <text x="40" y="170" fill="#9aa5ce" font-family="Segoe UI, Arial, sans-serif" font-size="18">Workflow ./github/workflows/streak.yml will auto-refresh this file from streak-stats.demolab.com.</text>
</svg>
